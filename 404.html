<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Картина убежала — Неоновый бестиарий</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/neon-bestiary/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(50% 40% at 80% 10%, rgba(255, 61, 139, .35), transparent 70%),
        radial-gradient(50% 40% at 10% 90%, rgba(46, 230, 214, .25), transparent 70%),
        #0c0910;
      color: #f6f1ea; font: 500 17px/1.6 "Manrope", system-ui, sans-serif;
    }
    .box { max-width: 560px; }
    img {
      width: 220px; height: auto; margin: 0 auto 28px; display: block;
      padding: 10px; background: #fff; border-radius: 24px; transform: rotate(-6deg);
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .8), 0 0 80px -20px rgba(150, 230, 80, .6);
    }
    h1 {
      margin: 0 0 14px; font: 900 clamp(64px, 18vw, 140px)/.9 "Unbounded", sans-serif; letter-spacing: -.05em;
      background: linear-gradient(90deg, #ff3d8b, #ff7a1a, #e6ff3d, #2ee6d6, #8b5cff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { margin: 0 0 30px; color: #d9d0e2; }
    a {
      display: inline-block; padding: 16px 28px; border-radius: 999px;
      background: #ff3d8b; color: #fff; font-weight: 700; text-decoration: none;
      box-shadow: 0 10px 34px -8px rgba(255, 61, 139, .8);
    }
    a:hover { background: #ff5a9d; }
  </style>
</head>
<body>
  <main class="box">
    <img src="/neon-bestiary/img/trex.jpg" alt="Талисман выставки — зелёная динозавриха" width="220" height="234">
    <h1>404</h1>
    <p>Эта картина убежала из рамы. Порычим и вернёмся в зал?</p>
    <a href="/neon-bestiary/">На выставку</a>
  </main>
</body>
</html>
